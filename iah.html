<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>I Love you my Iah</title>
	<style>
		:root {
			color-scheme: dark;
			--rose-deep: #570714;
			--rose: #b20d2f;
			--rose-light: #ff315d;
			--rose-glow: rgba(255, 25, 75, 0.42);
			--ink: #fff3f4;
			--muted: #c7969e;
		}

		* { box-sizing: border-box; }

		body {
			min-height: 100vh;
			margin: 0;
			overflow: hidden;
			display: grid;
			place-items: center;
			background: #10070a;
			color: var(--ink);
			font-family: Georgia, 'Times New Roman', serif;
		}

		body::before {
			content: '';
			position: fixed;
			inset: 0;
			pointer-events: none;
			background: radial-gradient(circle at 50% 42%, rgba(130, 9, 31, 0.4), transparent 31%), linear-gradient(135deg, #17080d, #080608 65%);
		}

		.scene {
			position: relative;
			z-index: 1;
			width: min(92vw, 760px);
			min-height: 92vh;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			text-align: center;
			perspective: 1000px;
		}

		.eyebrow {
			margin: 0 0 1rem;
			color: #ff8fa4;
			font: 600 0.68rem/1 Arial, sans-serif;
			letter-spacing: 0.3em;
			text-transform: uppercase;
		}

		h1 {
			margin: 0;
			font-size: clamp(2.5rem, 7vw, 5.7rem);
			font-weight: 400;
			line-height: 0.96;
			letter-spacing: 0;
			text-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
		}

		.subtitle {
			margin: 1rem 0 0;
			color: var(--muted);
			font: 0.85rem/1.5 Arial, sans-serif;
			letter-spacing: 0.04em;
		}

		.rose-wrap {
			position: relative;
			width: min(76vw, 430px);
			height: min(68vh, 470px);
			margin: 0.5rem 0 0.6rem;
			transform-style: preserve-3d;
			cursor: pointer;
		}

		.rose-wrap::after {
			content: '';
			position: absolute;
			left: 50%;
			bottom: 1%;
			width: 56%;
			height: 7%;
			transform: translateX(-50%);
			border-radius: 50%;
			background: rgba(0, 0, 0, 0.7);
			filter: blur(18px);
		}

		.rose {
			position: absolute;
			top: 8%;
			left: 50%;
			width: 230px;
			height: 240px;
			transform: translateX(-50%) rotateX(8deg) rotateZ(-3deg);
			transform-style: preserve-3d;
			transition: transform 1s cubic-bezier(.2, .8, .2, 1);
			animation: float 5s ease-in-out infinite;
		}

		.rose-wrap:hover .rose,
		.rose-wrap.bloomed .rose {
			transform: translateX(-50%) rotateX(8deg) rotateZ(3deg) scale(1.08);
		}

		.petal {
			position: absolute;
			left: 50%;
			bottom: 12%;
			width: 105px;
			height: 160px;
			border-radius: 80% 22% 70% 25%;
			border: 1px solid rgba(255, 113, 137, 0.35);
			background: linear-gradient(135deg, var(--rose-light), var(--rose) 48%, var(--rose-deep));
			box-shadow: inset 12px -12px 25px rgba(45, 0, 7, 0.6), inset -8px 8px 15px rgba(255, 135, 154, 0.25), 0 5px 18px rgba(93, 0, 16, 0.4);
			transform-origin: 50% 90%;
			transform-style: preserve-3d;
		}

		.petal:nth-child(1) { transform: translateX(-50%) rotateY(0deg) rotateZ(0deg) translateZ(18px); }
		.petal:nth-child(2) { transform: translateX(-50%) rotateY(55deg) rotateZ(-24deg) translateZ(3px); }
		.petal:nth-child(3) { transform: translateX(-50%) rotateY(-55deg) rotateZ(24deg) translateZ(3px); }
		.petal:nth-child(4) { transform: translateX(-50%) rotateY(105deg) rotateZ(-45deg) translateZ(-15px) scale(.9); }
		.petal:nth-child(5) { transform: translateX(-50%) rotateY(-105deg) rotateZ(45deg) translateZ(-15px) scale(.9); }
		.petal:nth-child(6) { transform: translateX(-50%) rotateY(180deg) rotateZ(0deg) translateZ(-25px) scale(.88); }

		.center {
			position: absolute;
			z-index: 4;
			left: 50%;
			top: 30%;
			width: 72px;
			height: 72px;
			transform: translate(-50%, -50%) translateZ(42px);
			border-radius: 50%;
			background: radial-gradient(circle at 35% 30%, #ff8298, #bf1035 35%, #4b000c 78%);
			box-shadow: 0 0 28px var(--rose-glow), inset 8px -10px 16px rgba(37, 0, 5, 0.75);
		}

		.center::after {
			content: '';
			position: absolute;
			inset: 13px 18px 19px 20px;
			border-radius: 50% 30% 55% 35%;
			border-left: 7px solid rgba(255, 147, 163, 0.55);
			transform: rotate(-35deg);
		}

		.stem {
			position: absolute;
			z-index: -1;
			left: 50%;
			top: 46%;
			width: 17px;
			height: 51%;
			border-radius: 50%;
			transform: translateX(-50%) rotate(3deg) translateZ(-20px);
			background: linear-gradient(90deg, #0d421d, #2f8b3d 48%, #123e1d);
			box-shadow: 7px 0 16px rgba(0, 0, 0, 0.5);
		}

		.leaf {
			position: absolute;
			z-index: -1;
			top: 68%;
			left: 50%;
			width: 105px;
			height: 43px;
			border-radius: 100% 0 100% 0;
			background: linear-gradient(135deg, #4f9d50, #123d1c 70%);
			box-shadow: inset 5px 5px 8px rgba(167, 227, 143, 0.2);
			transform-origin: 0 100%;
		}

		.leaf-left { transform: translateX(-95%) rotate(-22deg) translateZ(-12px); }
		.leaf-right { transform: translateX(-5%) rotate(24deg) scaleX(-1) translateZ(-12px); }

		.prompt {
			color: #a86f7a;
			font: 0.68rem/1.2 Arial, sans-serif;
			letter-spacing: 0.2em;
			text-transform: uppercase;
		}

		@keyframes float {
			0%, 100% { margin-top: 0; }
			50% { margin-top: -10px; }
		}

		@media (prefers-reduced-motion: reduce) {
			.rose { animation: none; transition: none; }
		}

		@media (max-height: 700px) {
			.scene { min-height: 100vh; }
			.rose-wrap { height: 52vh; }
			.rose { top: 0; transform: translateX(-50%) scale(.8); }
			.rose-wrap:hover .rose, .rose-wrap.bloomed .rose { transform: translateX(-50%) scale(.86); }
		}
	</style>
</head>
<body>
	<main class="scene">
		<p class="eyebrow">For someone unforgettable</p>
		<h1>I Love you my Iah</h1>
		<p class="subtitle">A red rose, made of light, just for you.</p>

		<div class="rose-wrap" id="roseScene" role="button" tabindex="0" aria-label="Make the rose bloom">
			<div class="rose">
				<div class="petal"></div>
				<div class="petal"></div>
				<div class="petal"></div>
				<div class="petal"></div>
				<div class="petal"></div>
				<div class="petal"></div>
				<div class="center"></div>
				<div class="stem"></div>
				<div class="leaf leaf-left"></div>
				<div class="leaf leaf-right"></div>
			</div>
		</div>

		<div class="prompt">Touch the rose to make it bloom</div>
	</main>
	<script>
		const roseScene = document.getElementById('roseScene');

		function bloom() {
			roseScene.classList.toggle('bloomed');
		}

		roseScene.addEventListener('click', bloom);
		roseScene.addEventListener('keydown', event => {
			if (event.key === 'Enter' || event.key === ' ') {
				event.preventDefault();
				bloom();
			}
		});
	</script>
</body>
</html>
