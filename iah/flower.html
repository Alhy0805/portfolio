  <!-- Document Title -->

<body class="not-loaded">
  <!-- Background -->
  <div class="night"></div>

  <a class="back-button" href="index.html" aria-label="Back to the Iah project home">
    <svg viewBox="0 0 24 24" aria-hidden="true">

    </svg>
    <span>Back</span>

  <div class="music-tab" style="position: fixed; left: 28px; bottom: 24px; z-index: 20; background: transparent; border: none; border-radius: 14px; padding: 0; box-shadow: none; backdrop-filter: none; color: #fff; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; align-items: flex-start; gap: 10px;">
    <div style="font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.8; margin-bottom: 0; color: #fff;">Now Playing</div>
    <div style="font-size: 18px; font-weight: 700; margin-bottom: 0; color: #fff;">Someday</div>
    <button id="music-toggle" type="button" style="border: none; border-radius: 999px; padding: 8px 14px; background: transparent; color: #fff; font-weight: 700; cursor: pointer; box-shadow: none; border: 1px solid rgba(255,255,255,0.24);">Pause</button>
    <audio id="iah-audio" src="audio/Someday.mp3" loop preload="auto"></audio>
  </div>

  <style>
    #music-toggle {
      position: relative;
      z-index: 2;
      margin-top: 0;
      border: none;
      border-radius: 999px;
      padding: 8px 14px;
      background: transparent;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      box-shadow: none;
      border: 1px solid rgba(255,255,255,0.24);
      pointer-events: auto;
    }
